# Signed-in users only ever see their own rows.

query MySongs @auth(level: USER) {
  songs(
    where: { owner: { uid: { eq_expr: "auth.uid" } } }
    orderBy: [{ updatedAt: DESC }]
    limit: 100
  ) {
    id
    title
    tempo
    updatedAt
  }
}

query GetSong($id: UUID!) @auth(level: USER) {
  song(first: { where: { id: { eq: $id }, owner: { uid: { eq_expr: "auth.uid" } } } }) {
    id
    title
    tempo
    settings
    updatedAt
    patterns: patterns_on_song {
      kind
      data
    }
    recordings: recordings_on_song(orderBy: [{ track: ASC }]) {
      track
      instrument
      ppq
      lengthTicks
      events
    }
  }
}
