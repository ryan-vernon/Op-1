<title>Tombola</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400&display=swap">
<style>
/* Layout: one portrait "device" — black OP-1 display with encoder glyphs in its corners and mode icons under the tombola;
   grey encoder row slides up beneath it; synth and fx modes take over the whole device in black. */
:root{
  --body:#85817c; --body-deep:#5e5b58; --cell:#85817c; --cell-sel:#94908b;
  --rule:rgba(255,255,255,.26); --ink:#f3f1ec; --ink-dim:rgba(243,241,236,.66);
  --screen:#08080a; --line-b:rgba(255,255,255,.13); --dim-b:rgba(236,236,234,.42);
  --blue:#5b8cff; --lav:#a4a6ff; --green:#22d07c; --white:#ececea; --orange:#ff5a3a;
  --knob-ring:#b9b5b0; --knob-edge:#6c6864; --bar-dark:#77736f; --knob-ring-b:#26262a; --knob-edge-b:#3f3f45;
  --f-ui:"Jost","Futura","Avenir Next","Century Gothic",system-ui,sans-serif;
  color-scheme:dark;
}
html{height:100%;box-sizing:border-box;background:var(--body-deep)}
@supports (height:100dvh){html{height:100dvh}}
*,*::before,*::after{box-sizing:inherit}
body{height:100%;margin:0;background:var(--body-deep);color:var(--ink);font-family:var(--f-ui);font-weight:300;
  display:flex;justify-content:center;align-items:center;overflow:hidden;overscroll-behavior:none;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,.knob:focus-visible{outline:2px solid var(--ink);outline-offset:2px}

#device{position:relative;width:100%;height:100%;background:var(--body);
  display:flex;flex-direction:column;gap:10px;padding:10px 12px 12px;overflow:hidden}

.topbar{display:flex;justify-content:space-between;align-items:baseline;font-size:15px;letter-spacing:.02em;padding-inline:2px}
.topbar .dim{color:var(--ink-dim);font-size:13px}

#display{position:relative;flex:1;min-height:0;background:var(--screen);border-radius:4px;overflow:hidden;touch-action:none}
#screen{position:absolute;inset:0;width:100%;height:100%;display:block}
.corner{position:absolute;display:flex;align-items:center;gap:18px;padding:20px;touch-action:none;z-index:2;line-height:1}
.corner .letter{font-size:clamp(26px,8.4vw,36px);font-weight:400}
.corner .num{font-size:clamp(26px,8.4vw,36px);color:var(--white);font-variant-numeric:tabular-nums;min-width:1.6em}
.corner svg{width:clamp(26px,8vw,34px);height:auto;overflow:visible}
#shIcon{width:clamp(34px,10vw,42px)}
.corner .peek{font-size:clamp(20px,6vw,26px);color:var(--white);font-variant-numeric:tabular-nums}
.tl{top:0;left:0}.tr{top:0;right:0}.br{bottom:0;right:0}.bl{bottom:0;left:0}
.s{color:var(--lav)}.g{color:var(--green)}.m{color:var(--orange)}
#hint{position:absolute;left:50%;bottom:92px;transform:translateX(-50%);width:calc(100% - 32px);font-size:13px;letter-spacing:.06em;color:var(--ink-dim);
  pointer-events:none;transition:opacity .6s;text-align:center;text-wrap:balance}
#modes{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);display:flex;gap:14px;z-index:2}
#modes button{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:11px;letter-spacing:.08em;color:var(--dim-b);padding:6px 6px 4px;min-width:58px}
#modes svg{width:46px;height:26px;color:var(--white)}

/* grey OP-1 body grid (physical encoders) */
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--rule);border:1px solid var(--rule)}
.grid4>*{background:var(--cell);min-width:0}
.kcell{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 0 9px;transition:background .2s}
.kcell.sel{background:var(--cell-sel)}
.knob{width:min(64px,15vw);aspect-ratio:1;touch-action:none;cursor:ns-resize;border-radius:50%}
.knob svg{width:100%;height:100%;display:block}
.knob .ring{fill:var(--knob-ring);stroke:var(--knob-edge);stroke-width:1}
.klabel{font-size:15px;letter-spacing:.01em;font-variant-numeric:tabular-nums;height:1.2em;white-space:nowrap}

.glyph{display:flex;align-items:center}
#encRing{position:absolute;z-index:3;touch-action:none;cursor:ns-resize;border-radius:50%}
#encRing svg{width:100%;height:100%;display:block;overflow:visible}

/* synth + fx modes: the whole device goes black */
.mode{position:absolute;inset:0;background:var(--screen);z-index:10;display:flex;flex-direction:column;
  padding:14px max(14px, calc((100% - 640px) / 2)) 16px;transition:transform .3s ease}
.mode.closed{transform:translateY(102%);pointer-events:none}
.mhead{display:flex;justify-content:space-between;align-items:center;padding:0 2px 12px;gap:12px}
.mhead .title{font-size:22px;display:flex;align-items:baseline;gap:10px}
.mhead .title small{font-size:14px;color:var(--dim-b)}
.mhead .done{font-size:14px;border:1px solid var(--line-b);padding:7px 16px;border-radius:2px}
.picker{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));border-top:1px solid var(--line-b)}
.picker button{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 0 10px;color:var(--dim-b);font-size:13px}
.picker svg{width:40px;height:24px;opacity:.45}
.picker button.on{color:var(--ink)}
.picker button.on svg{opacity:1}
.viz{position:relative;flex:1;min-height:170px;border-top:1px solid var(--line-b);border-bottom:1px solid var(--line-b)}
.viz canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.mode .grid4{background:transparent;border:0;gap:0}
.mode .grid4>*{background:transparent}
.mode .knob .ring{fill:var(--knob-ring-b);stroke:var(--knob-edge-b)}
.mode .kcell{padding:14px 0 10px}
.trow{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));border-top:1px solid var(--line-b)}
.trow button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:12px 2px 4px;font-size:15px}
.trow small{font-size:11px;color:var(--dim-b);letter-spacing:.06em}
.trow button.on span{color:var(--green)}
.fxtoggle{display:flex;border:1px solid var(--line-b)}
.fxtoggle button{padding:5px 12px;font-size:13px;color:var(--dim-b)}
.fxtoggle button.on{background:var(--ink);color:var(--screen)}
</style>

<div id="device">
  <div class="topbar"><span>tombola</span><span class="dim" id="status">fm · spring</span></div>

  <div id="display">
    <canvas id="screen"></canvas>
    <button class="corner tl" id="cSpeed" aria-label="Speed. Tap to show its encoder, drag up or down to turn">
      <span class="letter s">S</span><span class="glyph"><span class="num" id="speedNum">34</span></span>
    </button>
    <button class="corner tr" id="cGrav" aria-label="Gravity. Tap to show its encoder, drag up or down to turn">
      <span class="letter g">G</span>
      <span class="glyph"><span class="peek" id="gPeek" hidden></span>
      <svg id="gIcon" viewBox="0 0 32 32"><circle cx="16" cy="16" r="13" fill="none" stroke="var(--green)" stroke-width="2.4"/><circle id="gDot" cx="16" cy="16" r="5" fill="var(--green)"/></svg></span>
    </button>
    <button class="corner br" id="cMass" aria-label="Mass and bounciness. Tap to show its encoder, drag up or down to turn">
      <span class="letter m">M</span>
      <span class="glyph"><span class="peek" id="mPeek" hidden></span>
      <svg id="mIcon" viewBox="0 0 40 32"><g stroke="var(--orange)" stroke-width="2.4" stroke-linecap="round" fill="var(--orange)">
        <line x1="5" y1="14" x2="35" y2="14"/><circle cx="5" cy="14" r="3" stroke="none"/><circle cx="35" cy="14" r="3" stroke="none"/>
        <line id="mStem" x1="20" y1="14" x2="20" y2="26"/><circle id="mBob" cx="20" cy="26" r="2.6" stroke="none"/></g></svg></span>
    </button>
    <button class="corner bl" id="cShape" aria-label="Shape: opens the sides of the tombola. Tap to show its encoder, drag up or down to turn">
      <span class="glyph"><svg id="shIcon" viewBox="0 0 40 40"><g id="shLines" stroke="var(--white)" stroke-width="2.2" stroke-linecap="round"></g></svg>
      <span class="peek" id="shPeek" hidden></span></span>
    </button>
    <div id="modes">
      <button id="openSynth" aria-label="Synth settings"><svg id="synthGlyph" viewBox="0 0 40 24"></svg><span id="synthGlyphName">fm</span></button>
      <button id="openFx" aria-label="Spring reverb settings"><svg id="springGlyph" viewBox="0 0 46 24"></svg><span>spring</span></button>
    </div>
    <div id="encRing" hidden></div>
    <div id="hint">tap to turn on sound · drag to spin</div>
  </div>


  <section id="synthMode" class="mode closed" aria-hidden="true">
    <div class="mhead"><div class="title">synth <small id="engTitle">fm</small></div><button class="done" data-close>done</button></div>
    <div class="picker" id="picker"></div>
    <div class="viz"><canvas id="synthCv"></canvas></div>
    <div class="grid4">
      <div class="kcell" data-knob="s0"></div><div class="kcell" data-knob="s1"></div>
      <div class="kcell" data-knob="s2"></div><div class="kcell" data-knob="s3"></div>
    </div>
    <div class="trow">
      <button id="keyBtn"><span id="keyName">C</span><small>key</small></button>
      <button id="scaleBtn"><span id="scaleName">major</span><small>scale</small></button>
      <button id="tiltBtn"><span id="tiltName">off</span><small>tilt</small></button>
      <button id="seedBtn"><span>lay 5</span><small>notes</small></button>
      <button id="clearBtn"><span id="noteCount">3</span><small>clear</small></button>
    </div>
  </section>

  <section id="fxMode" class="mode closed" aria-hidden="true">
    <div class="mhead"><div class="title">fx <small>spring</small></div>
      <div style="display:flex;gap:10px;align-items:center"><div class="fxtoggle"><button id="fxOn" class="on">on</button><button id="fxOff">off</button></div>
      <button class="done" data-close>done</button></div></div>
    <div class="viz"><canvas id="fxCv"></canvas></div>
    <div class="grid4">
      <div class="kcell" data-knob="taper"></div><div class="kcell" data-knob="turns"></div>
      <div class="kcell" data-knob="damp"></div><div class="kcell" data-knob="width"></div>
    </div>
  </section>
</div>

<script>
(() => {
const $ = s => document.querySelector(s);
const capture = (el, e) => { try { el.setPointerCapture(e.pointerId); } catch (err) {} };
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const TAU = Math.PI * 2, SIXTH = Math.PI / 3, APO = Math.cos(Math.PI / 6);
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const COL = {blue:css('--blue'), lav:css('--lav'), green:css('--green'), white:css('--white'), orange:css('--orange'), dim:css('--dim-b'), line:css('--line-b')};

/* ---------- synth engines (four encoder params each, after the OP-1) ---------- */
const ENGINES = {
  digital:{labels:['shaper','octave','detune','digital'], def:[30,75,25,35]},
  fm:     {labels:['ratio','amount','mod env','decay'], def:[55,40,40,50]},
  string: {labels:['tone','sustain','pluck','body'], def:[60,60,25,40]},
  pulse:  {labels:['width','cutoff','reso','decay'], def:[30,50,45,35]},
  cluster:{labels:['spread','voices','filter','decay'], def:[40,60,50,55]},
};
const ENGINE_ORDER = ['digital','fm','string','pulse','cluster'];
const FM_RATIOS = [0.5,1,1.5,2,2.5,3,3.5,4,5,7];

/* ---------- parameters ---------- */
const SPEC = {
  speed:  {min:-100, max:100, v:34, col:'blue', label:'speed'},
  gravity:{min:0, max:100, v:45, col:'green', label:'gravity'},
  shape:  {min:0, max:100, v:0,  col:'white', label:'shape'},
  mass:   {min:0, max:100, v:62, col:'orange', label:'mass'},
  taper:  {min:0, max:100, v:35, col:'blue', label:'taper'},
  turns:  {min:0, max:100, v:45, col:'green', label:'turns'},
  damp:   {min:0, max:100, v:40, col:'white', label:'damp'},
  width:  {min:0, max:100, v:55, col:'orange', label:'width'},
  s0:{min:0, max:100, col:'blue'}, s1:{min:0, max:100, col:'green'}, s2:{min:0, max:100, col:'white'}, s3:{min:0, max:100, col:'orange'},
};
const P = {}; for (const k in SPEC) P[k] = SPEC[k].v;
P.engine = 'fm'; P.fx = true; P.digiRing = false; P.key = 0; P.scale = 'major';
P.syn = {}; for (const e of ENGINE_ORDER) P.syn[e] = ENGINES[e].def.slice();
const loadEngineParams = () => P.syn[P.engine].forEach((v, i) => P['s' + i] = v);
loadEngineParams();
const sv = i => P.syn[P.engine][i] / 100;
const KEYS = ['C','C♯','D','E♭','E','F','F♯','G','A♭','A','B♭','B'];
const SCALES = {major:[0,2,4,7,9], minor:[0,3,5,7,10]};
const labelOf = name => {
  if (!(name[0] === 's' && name.length === 2)) return SPEC[name].label;
  if (P.engine === 'digital' && name === 's2') return P.digiRing ? 'ring mod' : 'detune';
  return ENGINES[P.engine].labels[+name[1]];
};

const knobViews = {};
function setParam(name, v) {
  const s = SPEC[name];
  v = Math.round(clamp(v, s.min, s.max));
  if (v === P[name]) return;
  P[name] = v;
  if (name[0] === 's' && name.length === 2) P.syn[P.engine][+name[1]] = v;
  (knobViews[name] || []).forEach(f => f(true));
  onParam(name);
}

/* ---------- knobs ---------- */
function buildKnob(cell) {
  const name = cell.dataset.knob, s = SPEC[name];
  const bar = s.col === 'white' ? 'var(--bar-dark)' : '#f6f6f4';
  cell.innerHTML = `<div class="knob" tabindex="0" role="slider" aria-valuemin="${s.min}" aria-valuemax="${s.max}">
    <svg viewBox="0 0 64 64"><circle class="ring" cx="32" cy="32" r="30"/><circle cx="32" cy="32" r="19" fill="var(--${s.col})"/>
    <g class="bar"><rect x="15" y="29" width="34" height="6" rx="3" fill="${bar}"/></g></svg></div>
    <div class="klabel"></div>`;
  const knob = cell.querySelector('.knob'), g = cell.querySelector('.bar'), lab = cell.querySelector('.klabel');
  let showT = 0, peeking = false;
  const render = (peek) => {
    const n = (P[name] - s.min) / (s.max - s.min);
    g.setAttribute('transform', `rotate(${-45 + n * 270} 32 32)`);
    knob.setAttribute('aria-valuenow', P[name]);
    knob.setAttribute('aria-label', labelOf(name));
    if (peek) {
      peeking = true; lab.textContent = P[name]; clearTimeout(showT);
      showT = setTimeout(() => { peeking = false; lab.textContent = labelOf(name); }, 900);
    } else if (!peeking) lab.textContent = labelOf(name);
  };
  (knobViews[name] ||= []).push(render);
  render(false);
  const range = s.max - s.min;
  let drag = null;
  knob.addEventListener('pointerdown', e => { firstGesture(); capture(knob, e); drag = {x:e.clientX, y:e.clientY, v:P[name]}; e.preventDefault(); });
  knob.addEventListener('pointermove', e => {
    if (!drag) return;
    if (Math.hypot(e.clientX - drag.x, e.clientY - drag.y) > 4) drag.moved = true;
    setParam(name, drag.v + ((drag.y - e.clientY) + (e.clientX - drag.x)) * range / 240);
  });
  knob.addEventListener('pointerup', () => {
    // tapping the white encoder on digital toggles ring modulation, as pressing it does on the OP-1
    if (drag && !drag.moved && name === 's2' && P.engine === 'digital') {
      P.digiRing = !P.digiRing; digiCache.clear(); render(false); playNote(noteMidi(5), 0.55, 0);
    }
    drag = null;
  });
  knob.addEventListener('pointercancel', () => drag = null);
  knob.addEventListener('wheel', e => { e.preventDefault(); setParam(name, P[name] - e.deltaY * range / 1200); }, {passive:false});
  knob.addEventListener('keydown', e => {
    const d = {ArrowUp:1, ArrowRight:1, ArrowDown:-1, ArrowLeft:-1}[e.key];
    if (d) { e.preventDefault(); setParam(name, P[name] + d * range / 50); }
  });
}
document.querySelectorAll('.kcell[data-knob]').forEach(buildKnob);

/* ---------- corners ---------- */
/* tapping a corner icon puts an encoder ring around it, like turning that OP-1 knob */
const ringEl = $('#encRing');
let ringName = null, ringBtn = null, ringKey = '', ringR = 0;
function toggleRing(name, btn) {
  if (ringName === name) { closeRing(); return; }
  ringName = name; ringBtn = btn; ringKey = ''; ringEl.hidden = false; placeRing();
}
function closeRing() { ringName = null; ringEl.hidden = true; }
function placeRing() {
  if (!ringName) return;
  const g = ringBtn.querySelector('.glyph').getBoundingClientRect(), dr = display.getBoundingClientRect();
  ringR = Math.round(Math.max(g.width, g.height) / 2 + 13);
  ringEl.style.left = (g.left + g.width / 2 - dr.left - ringR) + 'px';
  ringEl.style.top = (g.top + g.height / 2 - dr.top - ringR) + 'px';
  ringEl.style.width = ringEl.style.height = ringR * 2 + 'px';
  const key = ringName + '|' + ringR + '|' + P[ringName];
  if (key !== ringKey) { ringKey = key; renderRing(); }
}
function renderRing() {
  const sp = SPEC[ringName], r = ringR, rr = r - 3, col = `var(--${sp.col === 'blue' ? 'lav' : sp.col})`;
  const n = (P[ringName] - sp.min) / (sp.max - sp.min), a1 = -135 + n * 270, a0 = sp.min < 0 ? 0 : -135;
  const pt = a => { const t = a * Math.PI / 180; return [(r + rr * Math.sin(t)).toFixed(1), (r - rr * Math.cos(t)).toFixed(1)]; };
  const arc = (from, to) => { const [x0, y0] = pt(from), [x1, y1] = pt(to); return `M${x0} ${y0}A${rr} ${rr} 0 ${Math.abs(to - from) > 180 ? 1 : 0} ${to > from ? 1 : 0} ${x1} ${y1}`; };
  const [dx, dy] = pt(a1);
  ringEl.innerHTML = `<svg viewBox="0 0 ${r * 2} ${r * 2}"><g fill="none" stroke="${col}" stroke-linecap="round">
    <path d="${arc(-135, 135)}" stroke-width="1.5" opacity=".3"/>
    ${Math.abs(a1 - a0) > 0.5 ? `<path d="${arc(a0, a1)}" stroke-width="3"/>` : ''}</g>
    <circle cx="${dx}" cy="${dy}" r="4.5" fill="${col}"/></svg>`;
  ringEl.setAttribute('aria-label', SPEC[ringName].label + ' ' + P[ringName]);
}
(() => {
  let d = null;
  ringEl.addEventListener('pointerdown', e => { capture(ringEl, e); d = {y:e.clientY, x:e.clientX, v:P[ringName], moved:false}; });
  ringEl.addEventListener('pointermove', e => {
    if (!d || !ringName) return;
    const dy = d.y - e.clientY, dx = e.clientX - d.x;
    if (!d.moved && Math.hypot(dx, dy) > 6) d.moved = true;
    if (d.moved) setParam(ringName, d.v + (dy + dx) * (SPEC[ringName].max - SPEC[ringName].min) / 260);
  });
  ringEl.addEventListener('pointerup', () => { if (d && !d.moved) closeRing(); d = null; });
  ringEl.addEventListener('pointercancel', () => d = null);
})();

function cornerControl(btn, name) {
  let d = null;
  btn.addEventListener('pointerdown', e => { firstGesture(); capture(btn, e); d = {y:e.clientY, x:e.clientX, v:P[name], moved:false}; });
  btn.addEventListener('pointermove', e => {
    if (!d) return;
    const dy = d.y - e.clientY, dx = e.clientX - d.x;
    if (!d.moved && Math.hypot(dx, dy) > 7) d.moved = true;
    if (d.moved) setParam(name, d.v + (dy + dx) * (SPEC[name].max - SPEC[name].min) / 260);
  });
  btn.addEventListener('pointerup', () => { if (d && !d.moved) toggleRing(name, btn); d = null; });
  btn.addEventListener('pointercancel', () => d = null);
  btn.addEventListener('keydown', e => {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggleRing(name, btn); }
    const k = {ArrowUp:1, ArrowRight:1, ArrowDown:-1, ArrowLeft:-1}[e.key];
    if (k) { e.preventDefault(); setParam(name, P[name] + k * (SPEC[name].max - SPEC[name].min) / 50); }
  });
}
cornerControl($('#cSpeed'), 'speed');
cornerControl($('#cGrav'), 'gravity');
cornerControl($('#cMass'), 'mass');
cornerControl($('#cShape'), 'shape');

const peekT = {};
function peek(id, iconId, v) {
  const p = $(id), ic = $(iconId);
  p.textContent = v; p.hidden = false; ic.style.display = 'none';
  clearTimeout(peekT[id]);
  peekT[id] = setTimeout(() => { p.hidden = true; ic.style.display = ''; }, 1100);
}
function hexLines(cx, cy, r, th, ph) {
  const out = [], c = Math.cos(-ph), s = Math.sin(-ph);
  for (let i = 0; i < 6; i++) {
    const a0 = th + i * SIXTH, ax = Math.cos(a0), ay = Math.sin(a0);
    let dx = Math.cos(a0 + SIXTH) - ax, dy = Math.sin(a0 + SIXTH) - ay;
    if (ph > 0.0005) { const nx = dx * c - dy * s, ny = dx * s + dy * c; dx = nx; dy = ny; }
    out.push([cx + ax * r, cy + ay * r, cx + (ax + dx) * r, cy + (ay + dy) * r]);
  }
  return out;
}
function renderCorners() {
  $('#speedNum').textContent = P.speed;
  $('#gDot').setAttribute('r', (1.5 + P.gravity / 100 * 8).toFixed(2));
  const len = 4 + P.mass / 100 * 14;
  $('#mStem').setAttribute('y2', 14 + len); $('#mBob').setAttribute('cy', 14 + len);
  $('#mBob').setAttribute('r', (1.6 + P.mass / 100 * 2.6).toFixed(2));
  $('#shLines').innerHTML = hexLines(20, 20, 14, 0, P.shape / 100 * 1.75)
    .map(l => `<line x1="${l[0].toFixed(1)}" y1="${l[1].toFixed(1)}" x2="${l[2].toFixed(1)}" y2="${l[3].toFixed(1)}"/>`).join('');
}
renderCorners();

function onParam(name) {
  if (['speed','gravity','mass','shape'].includes(name)) renderCorners();
  if (name === 'gravity') peek('#gPeek', '#gIcon', P.gravity);
