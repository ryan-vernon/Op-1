<title>Tombola</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Encode+Sans+Condensed:wght@200;300;400;500;600&display=swap">
<style>
/* Layout: the OP-1 as a grid of white tiles. One unit (--u) is the width of a white key.
   Phone: screen, T1–T4, transport, one octave of keys, mode bar (8 columns).
   iPad (wide screens): 18 x 12 units with a full-width 2½-octave keyboard. JS sets --u. */
:root{
  --bg:#fff; --tile-a:#F8F6F2; --tile-b:#EAE7E2; --ink:#2A2A2A; --screen:#000;
  --line-b:rgba(255,255,255,.13); --dim-b:rgba(236,236,234,.42);
  --blue:#5B7CFA; --lav:#5B7CFA; --green:#1ED68F; --white:#E9E9E9; --orange:#FF4D3D; --rec:#E8452C;
  --f-ui:"Encode Sans Condensed","Avenir Next Condensed",system-ui,sans-serif;
  --u:44px; --gap:4px; color-scheme:light;
}
html{height:100%;box-sizing:border-box;background:var(--bg)}
@supports (height:100dvh){html{height:100dvh}}
*,*::before,*::after{box-sizing:inherit}
body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-weight:300;
  display:flex;justify-content:center;align-items:center;overflow:hidden;overscroll-behavior:none;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible{outline:2px solid var(--blue);outline-offset:2px}

#device{display:grid;gap:var(--gap);padding:6px;width:100%;height:100%;
  grid-template-columns:repeat(8,minmax(0,1fr));
  grid-template-rows:minmax(140px,1fr) var(--u) var(--u) calc(var(--u) * 6 + var(--gap) * 5) var(--u)}
#display{grid-column:1/-1}
.tk,#shift,.mk{grid-column:span 2}
#keys{grid-column:1/-1}
#device .padonly{display:none}

/* tiles */
.tile{border:0;margin:0;padding:0;font:inherit;color:var(--ink);background:linear-gradient(180deg,var(--tile-a),var(--tile-b));
  border-radius:12px;box-shadow:inset 0 1px 0 #fff,inset 0 -2px 0 rgba(0,0,0,.06),0 1px 3px rgba(0,0,0,.14),0 0 0 1px rgba(0,0,0,.05);
  display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;min-width:0;min-height:0;position:relative;touch-action:manipulation}
.disc{width:calc(var(--u) * .7);height:calc(var(--u) * .7);border-radius:50%;flex:none;
  background:radial-gradient(circle at 38% 30%,#fff 0,#F1EFEB 55%,#E0DDD8 100%);box-shadow:0 4px 7px rgba(0,0,0,.2),0 1px 1px rgba(0,0,0,.25);
  display:flex;align-items:center;justify-content:center;font-size:calc(var(--u) * .36);font-weight:300;line-height:1}
.disc svg{width:58%;height:auto;overflow:visible}
.on .disc,.tile.down .disc{background:#E2DFDA;box-shadow:inset 0 3px 6px rgba(0,0,0,.28),inset 0 -1px 1px rgba(255,255,255,.8)}
.led{width:6px;height:6px;border-radius:50%;background:#D3CFC9;flex:none}
.tile.off{cursor:default}.tile.off .disc{opacity:.35;box-shadow:none;background:#E6E3DE}
.lbl{font-size:calc(var(--u) * .24);font-weight:600;letter-spacing:.1em}
#shift.on{background:linear-gradient(180deg,#E9E6E1,#DCD8D2);box-shadow:inset 0 2px 5px rgba(0,0,0,.18)}
#rec .dot{width:34%;height:34%;border-radius:50%;background:var(--rec)}
#rec.on .disc{background:radial-gradient(circle at 38% 30%,#FF7A5C 0,#E8452C 60%,#C7341E 100%);box-shadow:0 0 12px rgba(232,69,44,.55)}
#rec.on .dot{background:#fff}

/* keyboard: black keys 2 units, white keys 4 units, oval white keys */
#keys{display:grid;gap:var(--gap);grid-template-columns:repeat(var(--nw,8),minmax(0,1fr));
  grid-template-rows:calc(var(--u) * 2 + var(--gap)) minmax(0,1fr);touch-action:none}
.brow{grid-row:1;grid-column:1/-1;position:relative}
.key.blk{position:absolute;top:0;bottom:0;padding:0}
.key.blk .bd{position:absolute;top:50%;transform:translate(-50%,-50%)}
.key.wht{grid-row:2}
.bd{width:calc(var(--u) * .64);height:calc(var(--u) * .64);border-radius:50%;flex:none;
  background:radial-gradient(circle at 40% 30%,#555,#111 70%);box-shadow:0 3px 5px rgba(0,0,0,.35)}
.key.on .bd{background:radial-gradient(circle at 40% 30%,#3a3a3a,#000 70%);box-shadow:inset 0 2px 4px rgba(0,0,0,.7)}
.pill{width:calc(var(--u) * .6);height:calc(100% - var(--u) * .6);border-radius:999px;background:#F7F5F1;
  box-shadow:0 4px 7px rgba(0,0,0,.2),0 1px 1px rgba(0,0,0,.25),inset 0 1px 0 #fff}
.key.on .pill{box-shadow:inset 0 3px 6px rgba(0,0,0,.28)}

/* the display */
#display{position:relative;background:var(--screen);border-radius:30px 30px 12px 12px;overflow:hidden;touch-action:none;min-height:0;container-type:size;color:#E9E9E9}
#screen{position:absolute;inset:0;width:100%;height:100%;display:block}
.corner{position:absolute;display:flex;align-items:center;gap:3cqmin;padding:5cqmin;touch-action:none;z-index:2;line-height:1}
.corner .letter{font-size:9cqmin;font-weight:400}
.corner .num{font-size:9cqmin;color:var(--white);font-variant-numeric:tabular-nums;min-width:1.6em;font-weight:200}
.corner svg{width:8.5cqmin;height:auto;overflow:visible}
#shIcon{width:10.5cqmin}
.corner .peek{font-size:7cqmin;color:var(--white);font-variant-numeric:tabular-nums}
.tl{top:0;left:0}.tr{top:0;right:0}.br{bottom:0;right:0}.bl{bottom:0;left:0}
.s{color:var(--blue)}.g{color:var(--green)}.m{color:var(--orange)}
.pc{flex-direction:column;align-items:flex-start;gap:1.2cqmin}
.pc.tr,.pc.br{align-items:flex-end}
.pc .lab{font-size:3.3cqmin;font-weight:500;letter-spacing:.06em;text-transform:uppercase}
.pc .val{font-size:10cqmin;font-weight:200;font-variant-numeric:tabular-nums}
.c0{color:var(--blue)}.c1{color:var(--green)}.c2{color:var(--white)}.c3{color:var(--orange)}
#songTag{position:absolute;top:4.2cqmin;left:50%;transform:translateX(-50%);z-index:3;font-size:3.2cqmin;color:#8a8a8a;
  letter-spacing:.14em;text-transform:uppercase;white-space:nowrap;padding:1cqmin 2cqmin;max-width:46%;overflow:hidden;text-overflow:ellipsis}
#hint{position:absolute;left:50%;bottom:6.5cqmin;transform:translateX(-50%);width:52%;font-size:3.4cqmin;letter-spacing:.06em;color:var(--dim-b);
  pointer-events:none;transition:opacity .6s;text-align:center;text-wrap:balance;z-index:1}
#encRing{position:absolute;z-index:3;touch-action:none;cursor:ns-resize;border-radius:50%}
#encRing svg{width:100%;height:100%;display:block;overflow:visible}

/* iPad: 18 x 12 grid, every cell used */
body.pad #device{width:auto;height:auto;padding:0;grid-template-columns:repeat(18,var(--u));grid-template-rows:repeat(12,var(--u))}
body.pad #device .padonly{display:flex}
body.pad #display{border-radius:10px;grid-area:1/5/6/15}
body.pad #speaker{grid-area:1/1/4/3;cursor:default}
body.pad #volume{grid-area:1/3}  body.pad #help{grid-area:1/4}
body.pad #tempoKey{grid-area:2/3} body.pad #mic{grid-area:2/4}
body.pad #album{grid-area:3/3}   body.pad #seq{grid-area:3/4}
body.pad #m_synth{grid-area:4/1} body.pad #m_drum{grid-area:4/2} body.pad #m_tape{grid-area:4/3} body.pad #m_mixer{grid-area:4/4}
body.pad #lift{grid-area:5/1} body.pad #drop{grid-area:5/2} body.pad #split{grid-area:5/3} body.pad #octDn{grid-area:5/4}
body.pad #rec{grid-area:6/1} body.pad #play{grid-area:6/2} body.pad #stop{grid-area:6/3} body.pad #octUp{grid-area:6/4}
body.pad #shift{grid-area:6/5/7/7}
body.pad #t0{grid-area:6/7/7/9} body.pad #t1{grid-area:6/9/7/11} body.pad #t2{grid-area:6/11/7/13} body.pad #t3{grid-area:6/13/7/15}
body.pad #k0{grid-area:1/15/3/17} body.pad #k1{grid-area:1/17/3/19} body.pad #k2{grid-area:3/15/5/17} body.pad #k3{grid-area:3/17/5/19}
body.pad .snd{grid-row:5}body.pad #snd4,body.pad #snd5,body.pad #snd6,body.pad #snd7{grid-row:6}
body.pad #keys{grid-area:7/1/13/19;grid-template-rows:calc(var(--u) * 2 + var(--gap)) minmax(0,1fr)}
#speaker .grill{display:grid;grid-template-columns:repeat(8,5px);gap:6px 5px}
#speaker .grill i{width:5px;height:5px;border-radius:50%;background:#2A2A2A}
.knob{width:calc(var(--u) * 1.5);height:calc(var(--u) * 1.5);border-radius:50%;background:radial-gradient(circle at 40% 32%,#fff,#E4E1DC 70%);
  box-shadow:0 6px 12px rgba(0,0,0,.22),0 1px 2px rgba(0,0,0,.3);display:flex;align-items:center;justify-content:center;touch-action:none;cursor:ns-resize}
.cap{width:62%;height:62%;border-radius:50%;display:flex;justify-content:center;box-shadow:inset 0 -3px 5px rgba(0,0,0,.2)}
.cap i{display:block;width:10%;height:40%;margin-top:9%;border-radius:3px;background:rgba(255,255,255,.85)}
#k2 .cap i{background:#2A2A2A}

/* song sheet (album) */
#sheet{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.94);color:#E9E9E9;display:flex;justify-content:center;align-items:flex-start;
  padding:max(24px,env(safe-area-inset-top)) 16px 24px;overflow:auto;font-size:15px;letter-spacing:.02em}
#sheet[hidden]{display:none}
#sheet .box{width:100%;max-width:480px;display:flex;flex-direction:column;gap:18px}
#sheet h2{margin:0;font-weight:400;font-size:22px;display:flex;justify-content:space-between;align-items:center}
#sheet .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
#sheet .sbtn{border:1px solid rgba(255,255,255,.28);padding:8px 14px;border-radius:3px;font-size:14px}
#sheet .sbtn.pri{background:#E9E9E9;color:#000;border-color:#E9E9E9}
#sheet input{flex:1;min-width:0;background:transparent;border:0;border-bottom:1px solid rgba(255,255,255,.35);color:#fff;font:inherit;font-size:20px;padding:6px 0}
#sheet .muted{color:rgba(233,233,233,.55);font-size:13px}
#sheet ul{list-style:none;margin:0;padding:0;border-top:1px solid rgba(255,255,255,.14)}
#sheet li{display:flex;align-items:center;gap:10px;border-bottom:1px solid rgba(255,255,255,.14)}
#sheet li button.open{flex:1;text-align:left;padding:12px 2px;display:flex;justify-content:space-between;gap:10px}
#sheet li button.del{padding:12px 8px;color:rgba(233,233,233,.5)}
#sheet .k{color:var(--blue)}
</style>

<div id="device">
  <div id="display">
    <canvas id="screen"></canvas>
    <button id="songTag" aria-label="Songs and account">untitled</button>
    <div id="tombUI">
      <button class="corner tl" id="cSpeed" aria-label="Speed. Tap to show its encoder, drag up or down to turn">
        <span class="letter s">S</span><span class="glyph"><span class="num" id="speedNum">34</span></span>
      </button>
      <button class="corner tr" id="cGrav" aria-label="Gravity. Tap to show its encoder, drag up or down to turn">
        <span class="letter g">G</span>
        <span class="glyph"><span class="peek" id="gPeek" hidden></span>
        <svg id="gIcon" viewBox="0 0 32 32"><circle cx="16" cy="16" r="13" fill="none" stroke="var(--green)" stroke-width="2.4"/><circle id="gDot" cx="16" cy="16" r="5" fill="var(--green)"/></svg></span>
      </button>
      <button class="corner br" id="cMass" aria-label="Mass and bounciness. Tap to show its encoder, drag up or down to turn">
        <span class="letter m">M</span>
        <span class="glyph"><span class="peek" id="mPeek" hidden></span>
        <svg id="mIcon" viewBox="0 0 40 32"><g stroke="var(--orange)" stroke-width="2.4" stroke-linecap="round" fill="var(--orange)">
          <line x1="5" y1="14" x2="35" y2="14"/><circle cx="5" cy="14" r="3" stroke="none"/><circle cx="35" cy="14" r="3" stroke="none"/>
          <line id="mStem" x1="20" y1="14" x2="20" y2="26"/><circle id="mBob" cx="20" cy="26" r="2.6" stroke="none"/></g></svg></span>
      </button>
      <button class="corner bl" id="cShape" aria-label="Shape: opens the sides of the tombola. Tap to show its encoder, drag up or down to turn">
        <span class="glyph"><svg id="shIcon" viewBox="0 0 40 40"><g id="shLines" stroke="var(--white)" stroke-width="2.2" stroke-linecap="round"></g></svg>
        <span class="peek" id="shPeek" hidden></span></span>
      </button>
    </div>
    <div id="pageUI" hidden>
      <button class="corner pc tl c0" data-slot="0"><span class="lab"></span><span class="val"></span></button>
      <button class="corner pc tr c1" data-slot="1"><span class="lab"></span><span class="val"></span></button>
      <button class="corner pc bl c2" data-slot="2"><span class="lab"></span><span class="val"></span></button>
      <button class="corner pc br c3" data-slot="3"><span class="lab"></span><span class="val"></span></button>
    </div>
    <div id="encRing" hidden></div>
    <div id="hint">tap to turn on sound · drag to spin</div>
  </div>

  <button class="tile tk" id="t0" data-t="0" aria-label="T1"><span class="disc">1</span><span class="led"></span></button>
  <button class="tile tk" id="t1" data-t="1" aria-label="T2"><span class="disc">2</span><span class="led"></span></button>
  <button class="tile tk" id="t2" data-t="2" aria-label="T3"><span class="disc">3</span><span class="led"></span></button>
  <button class="tile tk" id="t3" data-t="3" aria-label="T4"><span class="disc">4</span><span class="led"></span></button>

  <button class="tile" id="rec" aria-label="Record"><span class="disc"><span class="dot"></span></span></button>
  <button class="tile" id="play" aria-label="Play"><span class="disc"><svg viewBox="0 0 12 12"><path d="M3 1.5l7.5 4.5-7.5 4.5z" fill="#2A2A2A"/></svg></span></button>
  <button class="tile" id="stop" aria-label="Stop"><span class="disc"><svg viewBox="0 0 12 12"><rect x="2" y="2" width="8" height="8" fill="#2A2A2A"/></svg></span></button>
  <button class="tile" id="seq" aria-label="Sequencer: Tombola"><span class="disc"><svg viewBox="0 0 16 12"><circle cx="3" cy="9" r="1.6" fill="#5B7CFA"/><circle cx="8" cy="3" r="1.6" fill="#5B7CFA"/><circle cx="13" cy="7" r="1.6" fill="#5B7CFA"/></svg></span></button>
  <button class="tile" id="octDn" aria-label="Octave down"><span class="disc">‹</span></button>
  <button class="tile" id="octUp" aria-label="Octave up"><span class="disc">›</span></button>
  <button class="tile" id="shift" aria-label="Shift"><span class="lbl">SHIFT</span></button>

  <div id="keys" role="group" aria-label="Keyboard"></div>

  <button class="tile mk" id="m_synth" data-mode="synth" aria-label="Synth"><span class="disc"><svg viewBox="0 0 20 14" fill="none" stroke="#5B7CFA" stroke-width="1.8"><path d="M2 12V4a2 2 0 0 1 4 0v6a2 2 0 0 0 4 0V4a2 2 0 0 1 4 0v6a2 2 0 0 0 4 0V2"/></svg></span><span class="led"></span></button>
  <button class="tile mk" id="m_drum" data-mode="drum" aria-label="Drum"><span class="disc"><svg viewBox="0 0 16 16" fill="none" stroke="#1ED68F" stroke-width="1.8"><circle cx="8" cy="6.5" r="4.5"/><path d="M8 11v4"/></svg></span><span class="led"></span></button>
  <button class="tile mk" id="m_tape" data-mode="tape" aria-label="Tape"><span class="disc"><svg viewBox="0 0 20 12" fill="none" stroke="#FF4D3D" stroke-width="1.8"><circle cx="5" cy="6" r="3.5"/><circle cx="15" cy="6" r="3.5"/><path d="M5 9.5h10"/></svg></span><span class="led"></span></button>
  <button class="tile mk" id="m_mixer" data-mode="mixer" aria-label="Mixer"><span class="disc"><svg viewBox="0 0 16 14" fill="none" stroke="#8A8A8A" stroke-width="1.8"><path d="M3 13V8M8 13V2M13 13V6"/></svg></span><span class="led"></span></button>

  <!-- iPad only -->
  <div class="tile padonly" id="speaker" aria-hidden="true"><span class="grill"></span></div>
  <button class="tile padonly" id="volume" aria-label="Volume. Drag up or down"><span class="disc" style="width:calc(var(--u)*.78);height:calc(var(--u)*.78)"></span></button>
  <button class="tile padonly" id="help" aria-label="Help"><span class="disc"><svg viewBox="0 0 18 16" fill="none" stroke="#2A2A2A" stroke-width="1.5"><path d="M2 2h14v9H7l-4 3v-3H2z"/></svg></span></button>
  <button class="tile padonly" id="tempoKey" aria-label="Tempo: tap to set"><span class="disc"><svg viewBox="0 0 16 22" fill="none" stroke="#2A2A2A" stroke-width="1.5"><path d="M6 1h4l6 20H0z M8 17l6-13"/></svg></span></button>
  <button class="tile padonly off" id="mic" aria-label="Mic input (not available)"><span class="disc"><svg viewBox="0 0 16 16"><circle cx="11" cy="5" r="3.5" fill="#FF4D3D"/><path d="M9 7L3 13" stroke="#FF4D3D" stroke-width="2" stroke-linecap="round"/></svg></span></button>
  <button class="tile padonly" id="album" aria-label="Songs and account"><span class="disc"><svg viewBox="0 0 16 16" fill="none" stroke="#2A2A2A" stroke-width="1.5"><circle cx="8" cy="8" r="6"/><circle cx="8" cy="8" r="1.5" fill="#2A2A2A"/></svg></span></button>
  <button class="tile padonly" id="lift" aria-label="Lift: cut the selected tape track"><span class="disc"><svg viewBox="0 0 16 16" fill="none" stroke="#FF4D3D" stroke-width="1.6"><path d="M8 13V3M4 7l4-4 4 4M3 15h10"/></svg></span></button>
  <button class="tile padonly" id="drop" aria-label="Drop: paste onto the selected tape track"><span class="disc"><svg viewBox="0 0 16 16" fill="none" stroke="#FF4D3D" stroke-width="1.6"><path d="M8 3v10M4 9l4 4 4-4M3 1h10"/></svg></span></button>
  <button class="tile padonly off" id="split" aria-label="Split (not available yet)"><span class="disc"><svg viewBox="0 0 16 16" fill="none" stroke="#FF4D3D" stroke-width="1.5"><circle cx="4" cy="4" r="2.5"/><circle cx="4" cy="12" r="2.5"/><path d="M6 5l9 7M6 11l9-7"/></svg></span></button>
  <button class="tile padonly snd" id="snd0" data-snd="0" style="grid-column:15" aria-label="Sound 1. Shift plus key stores the current sound"><span class="disc">1</span></button>
  <button class="tile padonly snd" id="snd1" data-snd="1" style="grid-column:16" aria-label="Sound 2. Shift plus key stores the current sound"><span class="disc">2</span></button>
  <button class="tile padonly snd" id="snd2" data-snd="2" style="grid-column:17" aria-label="Sound 3. Shift plus key stores the current sound"><span class="disc">3</span></button>
  <button class="tile padonly snd" id="snd3" data-snd="3" style="grid-column:18" aria-label="Sound 4. Shift plus key stores the current sound"><span class="disc">4</span></button>
  <button class="tile padonly snd" id="snd4" data-snd="4" style="grid-column:15" aria-label="Sound 5. Shift plus key stores the current sound"><span class="disc">5</span></button>
  <button class="tile padonly snd" id="snd5" data-snd="5" style="grid-column:16" aria-label="Sound 6. Shift plus key stores the current sound"><span class="disc">6</span></button>
  <button class="tile padonly snd" id="snd6" data-snd="6" style="grid-column:17" aria-label="Sound 7. Shift plus key stores the current sound"><span class="disc">7</span></button>
  <button class="tile padonly snd" id="snd7" data-snd="7" style="grid-column:18" aria-label="Sound 8. Shift plus key stores the current sound"><span class="disc">8</span></button>
  <div class="tile padonly" id="k0" data-k="0"><span class="knob"><span class="cap" style="background:var(--blue)"><i></i></span></span></div>
  <div class="tile padonly" id="k1" data-k="1"><span class="knob"><span class="cap" style="background:var(--green)"><i></i></span></span></div>
  <div class="tile padonly" id="k2" data-k="2"><span class="knob"><span class="cap" style="background:#F4F4F2"><i></i></span></span></div>
  <div class="tile padonly" id="k3" data-k="3"><span class="knob"><span class="cap" style="background:var(--orange)"><i></i></span></span></div>
</div>

<section id="sheet" hidden aria-label="Songs">
  <div class="box">
    <h2>songs <button class="sbtn" id="sheetClose">done</button></h2>
    <div class="row" id="acct"><span class="muted">cloud saving loads when you open this page online</span></div>
    <div class="row"><input id="songTitle" aria-label="Song title" value="untitled" maxlength="60"><span class="muted"><span class="k" id="bpmShow">120</span> bpm</span></div>
    <div class="row">
      <button class="sbtn pri" id="saveSong" disabled>save</button>
      <button class="sbtn" id="newSong">new song</button>
      <button class="sbtn" id="tiltBtn">tilt <span id="tiltName">off</span></button>
      <span class="muted" id="saveState"></span>
    </div>
    <ul id="songList"></ul>
    <p class="muted">Songs keep the sounds, the tombola pattern and the four tape tracks. The tape records notes (MIDI), not audio, so songs stay small.</p>
  </div>
</section>

<script>
(() => {
const $ = s => document.querySelector(s);
const capture = (el, e) => { try { el.setPointerCapture(e.pointerId); } catch (err) {} };
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const TAU = Math.PI * 2, SIXTH = Math.PI / 3, APO = Math.cos(Math.PI / 6);
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const COL = {blue:css('--blue'), lav:css('--lav'), green:css('--green'), white:css('--white'), orange:css('--orange'), dim:css('--dim-b'), line:css('--line-b')};

/* ---------- synth engines (four encoder params each, after the OP-1) ---------- */
const ENGINES = {
  digital:{labels:['shaper','octave','detune','digital'], def:[30,75,25,35]},
  fm:     {labels:['ratio','amount','mod env','decay'], def:[55,40,40,50]},
  string: {labels:['tone','sustain','pluck','body'], def:[60,60,25,40]},
  pulse:  {labels:['width','cutoff','reso','decay'], def:[30,50,45,35]},
  cluster:{labels:['spread','voices','filter','decay'], def:[40,60,50,55]},
};
const ENGINE_ORDER = ['digital','fm','string','pulse','cluster'];
const FM_RATIOS = [0.5,1,1.5,2,2.5,3,3.5,4,5,7];

/* ---------- parameters ---------- */
const SPEC = {
  speed:  {min:-100, max:100, v:34, col:'blue', label:'speed'},
  gravity:{min:0, max:100, v:45, col:'green', label:'gravity'},
  shape:  {min:0, max:100, v:0,  col:'white', label:'shape'},
  mass:   {min:0, max:100, v:62, col:'orange', label:'mass'},
  taper:  {min:0, max:100, v:35, col:'blue', label:'taper'},
  turns:  {min:0, max:100, v:45, col:'green', label:'turns'},
  damp:   {min:0, max:100, v:40, col:'white', label:'damp'},
  width:  {min:0, max:100, v:55, col:'orange', label:'width'},
  s0:{min:0, max:100, col:'blue'}, s1:{min:0, max:100, col:'green'}, s2:{min:0, max:100, col:'white'}, s3:{min:0, max:100, col:'orange'},
  // T2 envelope (held notes from the keys, MIDI and tape)
  atk:{min:0, max:100, v:4,  col:'blue', label:'attack'},
  dcy:{min:0, max:100, v:40, col:'green', label:'decay'},
  sus:{min:0, max:100, v:70, col:'white', label:'sustain'},
  rel:{min:0, max:100, v:30, col:'orange', label:'release'},
  // T4 LFO (tremolo)
  lspd:{min:0, max:100, v:35, col:'blue', label:'speed'},
  lpit:{min:0, max:100, v:0,  col:'green', label:'pitch'},
  lvol:{min:0, max:100, v:0,  col:'white', label:'volume'},
  lwav:{min:0, max:100, v:0,  col:'orange', label:'wave'},
  // drum kit
  dpit:{min:0, max:100, v:50, col:'blue', label:'pitch'},
  ddec:{min:0, max:100, v:50, col:'green', label:'decay'},
  dton:{min:0, max:100, v:50, col:'white', label:'tone'},
  dlvl:{min:0, max:100, v:80, col:'orange', label:'level'},
  // tape
  tempo:{min:40, max:240, v:120, col:'blue', label:'tempo'},
  bars: {min:1, max:16, v:4, col:'green', label:'bars'},
  click:{min:0, max:100, v:0, col:'orange', label:'click'},
  // mixer
  m1:{min:0, max:100, v:80, col:'blue', label:'track 1'}, m2:{min:0, max:100, v:80, col:'green', label:'track 2'},
  m3:{min:0, max:100, v:80, col:'white', label:'track 3'}, m4:{min:0, max:100, v:80, col:'orange', label:'track 4'},
  master:{min:0, max:100, v:85, col:'blue', label:'master'}, live:{min:0, max:100, v:80, col:'green', label:'live'},
  fxsend:{min:0, max:100, v:55, col:'white', label:'fx send'},

const P = {}; for (const k in SPEC) P[k] = SPEC[k].v;
P.engine = 'fm'; P.fx = true; P.digiRing = false; P.key = 0; P.scale = 'major';
P.syn = {}; for (const e of ENGINE_ORDER) P.syn[e] = ENGINES[e].def.slice();
const loadEngineParams = () => P.syn[P.engine].forEach((v, i) => P['s' + i] = v);
loadEngineParams();
const sv = i => P.syn[P.engine][i] / 100;
const KEYS = ['C','C♯','D','E♭','E','F','F♯','G','A♭','A','B♭','B'];
const SCALES = {major:[0,2,4,7,9], minor:[0,3,5,7,10]};
const labelOf = name => {
  if (!(name[0] === 's' && name.length === 2)) return SPEC[name].label;
  if (P.engine === 'digital' && name === 's2') return P.digiRing ? 'ring mod' : 'detune';
  return ENGINES[P.engine].labels[+name[1]];
};

const knobViews = {};
function setParam(name, v) {
  const s = SPEC[name];
  v = Math.round(clamp(v, s.min, s.max));
  if (v === P[name]) return;
  P[name] = v;
  if (name[0] === 's' && name.length === 2) P.syn[P.engine][+name[1]] = v;
  (knobViews[name] || []).forEach(f => f(true));
  onParam(name);
}


/* ---------- corners ---------- */
/* tapping a corner icon puts an encoder ring around it, like turning that OP-1 knob */
const ringEl = $('#encRing');
let ringName = null, ringBtn = null, ringKey = '', ringR = 0;
function toggleRing(name, btn) {
  if (ringName === name) { closeRing(); return; }
  ringName = name; ringBtn = btn; ringKey = ''; ringEl.hidden = false; placeRing();
}
function closeRing() { ringName = null; ringEl.hidden = true; }
function placeRing() {
  if (!ringName) return;
  const g = ringBtn.querySelector('.glyph').getBoundingClientRect(), dr = display.getBoundingClientRect();
  ringR = Math.round(Math.max(g.width, g.height) / 2 + 13);
  ringEl.style.left = (g.left + g.width / 2 - dr.left - ringR) + 'px';
  ringEl.style.top = (g.top + g.height / 2 - dr.top - ringR) + 'px';
  ringEl.style.width = ringEl.style.height = ringR * 2 + 'px';
  const key = ringName + '|' + ringR + '|' + P[ringName];
  if (key !== ringKey) { ringKey = key; renderRing(); }
}
function renderRing() {
  const sp = SPEC[ringName], r = ringR, rr = r - 3, col = `var(--${sp.col === 'blue' ? 'lav' : sp.col})`;
  const n = (P[ringName] - sp.min) / (sp.max - sp.min), a1 = -135 + n * 270, a0 = sp.min < 0 ? 0 : -135;
  const pt = a => { const t = a * Math.PI / 180; return [(r + rr * Math.sin(t)).toFixed(1), (r - rr * Math.cos(t)).toFixed(1)]; };
  const arc = (from, to) => { const [x0, y0] = pt(from), [x1, y1] = pt(to); return `M${x0} ${y0}A${rr} ${rr} 0 ${Math.abs(to - from) > 180 ? 1 : 0} ${to > from ? 1 : 0} ${x1} ${y1}`; };
  const [dx, dy] = pt(a1);
  ringEl.innerHTML = `<svg viewBox="0 0 ${r * 2} ${r * 2}"><g fill="none" stroke="${col}" stroke-linecap="round">
    <path d="${arc(-135, 135)}" stroke-width="1.5" opacity=".3"/>
    ${Math.abs(a1 - a0) > 0.5 ? `<path d="${arc(a0, a1)}" stroke-width="3"/>` : ''}</g>
    <circle cx="${dx}" cy="${dy}" r="4.5" fill="${col}"/></svg>`;
  ringEl.setAttribute('aria-label', SPEC[ringName].label + ' ' + P[ringName]);
}
(() => {
  let d = null;
  ringEl.addEventListener('pointerdown', e => { capture(ringEl, e); d = {y:e.clientY, x:e.clientX, v:P[ringName], moved:false}; });
  ringEl.addEventListener('pointermove', e => {
    if (!d || !ringName) return;
    const dy = d.y - e.clientY, dx = e.clientX - d.x;
    if (!d.moved && Math.hypot(dx, dy) > 6) d.moved = true;
    if (d.moved) setParam(ringName, d.v + (dy + dx) * (SPEC[ringName].max - SPEC[ringName].min) / 260);
  });
  ringEl.addEventListener('pointerup', () => { if (d && !d.moved) closeRing(); d = null; });
  ringEl.addEventListener('pointercancel', () => d = null);
})();

function cornerControl(btn, name) {
  let d = null;
  btn.addEventListener('pointerdown', e => { firstGesture(); capture(btn, e); d = {y:e.clientY, x:e.clientX, v:P[name], moved:false}; });
  btn.addEventListener('pointermove', e => {
    if (!d) return;
    const dy = d.y - e.clientY, dx = e.clientX - d.x;
    if (!d.moved && Math.hypot(dx, dy) > 7) d.moved = true;
    if (d.moved) setParam(name, d.v + (dy + dx) * (SPEC[name].max - SPEC[name].min) / 260);
  });
  btn.addEventListener('pointerup', () => { if (d && !d.moved) toggleRing(name, btn); d = null; });
  btn.addEventListener('pointercancel', () => d = null);
  btn.addEventListener('keydown', e => {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggleRing(name, btn); }
    const k = {ArrowUp:1, ArrowRight:1, ArrowDown:-1, ArrowLeft:-1}[e.key];
    if (k) { e.preventDefault(); setParam(name, P[name] + k * (SPEC[name].max - SPEC[name].min) / 50); }
  });
}
cornerControl($('#cSpeed'), 'speed');
cornerControl($('#cGrav'), 'gravity');
cornerControl($('#cMass'), 'mass');
cornerControl($('#cShape'), 'shape');

const peekT = {};
function peek(id, iconId, v) {
  const p = $(id), ic = $(iconId);
  p.textContent = v; p.hidden = false; ic.style.display = 'none';
  clearTimeout(peekT[id]);
  peekT[id] = setTimeout(() => { p.hidden = true; ic.style.display = ''; }, 1100);
}
function hexLines(cx, cy, r, th, ph) {
  const out = [], c = Math.cos(-ph), s = Math.sin(-ph);
  for (let i = 0; i < 6; i++) {
    const a0 = th + i * SIXTH, ax = Math.cos(a0), ay = Math.sin(a0);
    let dx = Math.cos(a0 + SIXTH) - ax, dy = Math.sin(a0 + SIXTH) - ay;
    if (ph > 0.0005) { const nx = dx * c - dy * s, ny = dx * s + dy * c; dx = nx; dy = ny; }
    out.push([cx + ax * r, cy + ay * r, cx + (ax + dx) * r, cy + (ay + dy) * r]);
  }
  return out;
}
function renderCorners() {
  $('#speedNum').textContent = P.speed;
  $('#gDot').setAttribute('r', (1.5 + P.gravity / 100 * 8).toFixed(2));
  const len = 4 + P.mass / 100 * 14;
  $('#mStem').setAttribute('y2', 14 + len); $('#mBob').setAttribute('cy', 14 + len);
  $('#mBob').setAttribute('r', (1.6 + P.mass / 100 * 2.6).toFixed(2));
  $('#shLines').innerHTML = hexLines(20, 20, 14, 0, P.shape / 100 * 1.75)
    .map(l => `<line x1="${l[0].toFixed(1)}" y1="${l[1].toFixed(1)}" x2="${l[2].toFixed(1)}" y2="${l[3].toFixed(1)}"/>`).join('');
}
renderCorners();

function onParam(name) {
  if (['speed','gravity','mass','shape'].includes(name)) renderCorners();
  if (name === 'gravity') peek('#gPeek', '#gIcon', P.gravity);
  if (name === 'mass') peek('#mPeek', '#mIcon', P.mass);
  if (name === 'shape') peek('#shPeek', '#shIcon', P.shape);
  if (['taper','turns','damp','width'].includes(name)) scheduleReverb();
  if (['lspd','lpit','lvol','lwav'].includes(name)) updateLfo();
  if (['master','live','fxsend','click','m1','m2','m3','m4'].includes(name)) updateGains();
  if (name === 'tempo') retime();
  renderShell(); markDirty();
}

/* ---------- glyphs ---------- */
function wavePath(x0, x1, yc, fn, n = 60) {
  let d = '';
  for (let i = 0; i <= n; i++) { const u = i / n; d += (i ? 'L' : 'M') + (x0 + u * (x1 - x0)).toFixed(1) + ' ' + (yc - fn(u)).toFixed(1); }
  return d;
}
const GLYPHS = {
  digital: `<path d="M3 18H8V10H13V5H18V10H23V15H28V20H33V12H37" fill="none" stroke="currentColor" stroke-width="2"/>`,
  fm: `<g fill="none" stroke="currentColor" stroke-width="2"><circle cx="14" cy="12" r="8"/><circle cx="30" cy="12" r="4.5"/><line x1="22" y1="12" x2="25.5" y2="12"/></g>`,
  string: `<path d="${wavePath(3, 37, 12, u => Math.sin(u * TAU * 4) * 9 * Math.exp(-u * 2.4))}" fill="none" stroke="currentColor" stroke-width="2"/>`,
  pulse: `<path d="M3 18H8V6H11V18H19V6H22V18H30V6H33V18H37" fill="none" stroke="currentColor" stroke-width="2"/>`,

};

/* ---------- OP-1 shell: four modes, T1–T4 pages, transport, keyboard ---------- */
/* synth and drum have pages T1–T4 plus the tombola sequencer (SEQ); tape uses T1–T4 to pick a track;
   mixer has levels (T1) and master (T2). Each page puts four parameters in the screen's corners,
   colored like the OP-1's encoders: blue, green, white, orange. */
const UI = {mode:'synth', page:{synth:0, drum:0, mixer:0}, seqOn:true, seqView:true, seqMode:'synth',
  shift:false, shiftUsed:false, oct:0, track:0, title:'untitled', dirty:false, presets:Array(8).fill(null)};
const WAVES = ['sine', 'triangle', 'square', 'sawtooth'];
const PAGES = {
  synth: [
    {name:'engine', params:['s0','s1','s2','s3'], draw:t => drawSynth(t)},
    {name:'envelope', params:['atk','dcy','sus','rel'], draw:() => drawEnvPage()},
    {name:'effect', params:['taper','turns','damp','width'], draw:t => drawSpring(t)},
    {name:'lfo', params:['lspd','lpit','lvol','lwav'], draw:t => drawLfo(t)}],
  drum: [
    {name:'kit', params:['dpit','ddec','dton','dlvl'], draw:t => drawDrum(t)}, null,
    {name:'effect', params:['taper','turns','damp','width'], draw:t => drawSpring(t)},
    {name:'lfo', params:['lspd','lpit','lvol','lwav'], draw:t => drawLfo(t)}],
  mixer: [
    {name:'levels', params:['m1','m2','m3','m4'], draw:() => drawMixer(['m1','m2','m3','m4'])},
    {name:'master', params:['master','live','fxsend','click'], draw:() => drawMixer(['master','live','fxsend','click'])}, null, null],
};
const TAPE_PAGE = {name:'tape', params:() => ['tempo','bars','m' + (UI.track + 1),'click'], draw:t => drawTape(t)};
const inSeqView = () => UI.seqOn && UI.seqView && (UI.mode === 'synth' || UI.mode === 'drum');
const curPage = () => UI.mode === 'tape' ? TAPE_PAGE : PAGES[UI.mode][UI.page[UI.mode]];
function pageParams() {
  if (inSeqView()) return ['speed','gravity','shape','mass'];
  const p = curPage(); return typeof p.params === 'function' ? p.params() : p.params;
}
const valueText = name => name === 'lwav' ? ['sine','tri','square','saw'][Math.min(3, Math.floor(P.lwav / 25))]
  : name === 'click' && !P.click ? 'off' : String(P[name]);
const curSynth = () => ({mode:'synth', engine:P.engine, vals:P.syn[P.engine].slice(), ring:P.digiRing, env:[P.atk, P.dcy, P.sus, P.rel]});
const curDrum = () => ({mode:'drum', kit:[P.dpit, P.ddec, P.dton, P.dlvl]});
const liveInst = () => UI.mode === 'drum' ? curDrum() : curSynth();
function playInst(inst, midi, vel, pan, o = {}) {
  return inst.mode === 'drum' ? playDrum(midi, vel, pan, inst, o) : playNote(midi, vel, pan, Object.assign({inst}, o));
}
function markDirty() { if (!UI.dirty) { UI.dirty = true; renderTag(); } window.dispatchEvent(new Event('tombola:change')); }

/* the screen's corners */
const pageUI = $('#pageUI'), tombUI = $('#tombUI');
const pcs = [...pageUI.querySelectorAll('.pc')];
pcs.forEach((btn, slot) => {

function renderTag() {

function renderShell() {
  const seqv = inSeqView(), names = pageParams();

  if (!seqv) pcs.forEach((b, i) => {
    const n = names[i], lab = n[0] === 's' && n.length === 2 ? labelOf(n) : SPEC[n].label, val = valueText(n);
    const l = b.querySelector('.lab'), v = b.querySelector('.val');

  });

    const n = names[i], s = SPEC[n], a = -135 + (P[n] - s.min) / (s.max - s.min) * 270;
    cell.querySelector('.cap').style.transform = `rotate(${a}deg)`;

  }

    if (UI.mode === 'tape') {
      on = UI.track === i; col = on ? (tape.recording ? 'var(--rec)' : 'var(--orange)') : tape.tracks[i].events.length ? '#9a958f' : '';
    } else {
      const pg = PAGES[UI.mode][i]; off = !pg; on = !seqv && UI.page[UI.mode] === i && !off;
      if (UI.mode !== 'mixer') col = i === 0 ? (UI.mode === 'drum' ? 'var(--green)' : 'var(--blue)') : i === 2 && P.fx ? 'var(--green)' : i === 3 && (P.lpit || P.lvol) ? 'var(--white)' : '';

/* T1–T4: pages in synth, drum and mixer; tracks in tape. Pressing the open page again does its
   second job: T1 changes the synth engine, T3 turns the effect on or off. */
function useShift() { const s = UI.shift; if (s) { UI.shift = false; UI.shiftUsed = true; } return s; }
function tPress(i) {
  firstGesture(); closeRing();
  const shift = useShift();
  if (UI.mode === 'tape') {
    if (shift) { tape.tracks[i] = {inst:null, events:[]}; markDirty(); }
    UI.track = i;
  } else if (inSeqView() && shift) {
    [() => layRun(), () => { dots.length = 0; }, () => { P.key = (P.key + 7) % 12; showHint('key ' + KEYS[P.key]); },
     () => { P.scale = P.scale === 'major' ? 'minor' : 'major'; showHint(P.scale); }][i]();
    markDirty();
  } else {
    const pages = PAGES[UI.mode]; if (!pages[i]) return;
    if (!inSeqView() && UI.page[UI.mode] === i) {
      if (UI.mode === 'synth' && i === 0) nextEngine(shift ? -1 : 1);
      if (i === 2) toggleFx();
    }
    UI.page[UI.mode] = i; UI.seqView = false;
  }
  renderShell();
}
function nextEngine(d) {

  loadEngineParams(); ensureAudio(); playNote(noteMidi(5), 0.55, 0); showHint(P.engine); markDirty();
}
function toggleFx() {

}

  renderShell();

  else if (!UI.seqView || UI.seqMode !== UI.mode) { UI.seqView = true; UI.seqMode = UI.mode; }
