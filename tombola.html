<title>Tombola</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Encode+Sans+Condensed:wght@100;200;300;400;500;600&display=swap">
<style>
/* Layout: the OP-1 as a grid of white tiles. One unit (--u) is the width of a white key.
   Phone: screen, T1–T4, transport, one octave of keys, mode bar (8 columns).
   iPad (wide screens): 18 x 12 units with a full-width 2½-octave keyboard. JS sets --u. */
:root{--k:calc(var(--u) / 92);
  --bg:#C1C1C8; --seam:#5E6373; --tile-a:#F8F6F2; --tile-b:#EAE7E2; --ink:#2A2A2A; --screen:#000;
  --line-b:rgba(255,255,255,.13); --dim-b:rgba(236,236,234,.42);
  --blue:#5B7CFA; --lav:#5B7CFA; --green:#1ED68F; --white:#E9E9E9; --orange:#FF4D3D; --rec:#E8452C;
  --f-ui:"Encode Sans Condensed","Avenir Next Condensed",system-ui,sans-serif;
  --u:44px; --gap:1px; color-scheme:light;
}
html{height:100%;box-sizing:border-box;background:var(--bg);position:fixed;inset:0;width:100%;overflow:hidden;overscroll-behavior:none;touch-action:none;-webkit-text-size-adjust:100%}
@supports (height:100dvh){html{height:100dvh}}
*,*::before,*::after{box-sizing:inherit}
body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-weight:300;
  display:flex;justify-content:center;align-items:center;overflow:hidden;overscroll-behavior:none;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible{outline:2px solid var(--blue);outline-offset:2px}

#device{display:grid;gap:var(--gap);padding:6px;width:100%;height:100%;background:var(--seam);
  box-shadow:0 calc(var(--u) * .5) calc(var(--u) * 1.2) calc(var(--u) * -.1) rgba(68,76,104,.4);
  grid-template-columns:repeat(8,minmax(0,1fr));
  grid-template-rows:minmax(140px,1fr) var(--u) var(--u) var(--u) var(--u) var(--u) calc(var(--u) * 4 + var(--gap) * 3)}
#display{grid-column:1/-1}
.tk,#shift,.mk,.enc{grid-column:span 2}
.snd{grid-column:span 1}
.enc{touch-action:none;cursor:ns-resize}
#keys{grid-column:1/-1}
#device .padonly{display:none}

/* tiles: flat panels with thin dark seams, raised round buttons and oval keys (after the OP-1 Figma kit) */
.tile{border:0;margin:0;padding:0;font:inherit;color:var(--ink);background:#CFD5E2;isolation:isolate;
  border-radius:calc(var(--k) * 5);box-shadow:inset 0 calc(var(--k) * -1.5) calc(var(--k) * 0.5) rgba(104,113,138,.5),inset 0 calc(var(--k) * 1.5) calc(var(--k) * 1) #fff;
  display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;min-width:0;min-height:0;position:relative;touch-action:manipulation}
.disc{width:calc(var(--k) * 64);height:calc(var(--k) * 64);border-radius:50%;flex:none;position:relative;
  background:#D3D9E6;
  box-shadow:calc(var(--k) * 5) calc(var(--k) * 5) calc(var(--k) * 10) #8991A6,inset calc(var(--k) * -1) calc(var(--k) * -1) 0 rgba(104,113,138,.5),calc(var(--k) * 1) calc(var(--k) * 1) calc(var(--k) * 3) rgba(246,249,255,.3),inset calc(var(--k) * 1.5) calc(var(--k) * 1.5) 0 #fff;
  display:flex;align-items:center;justify-content:center;font-size:calc(var(--u) * .36);font-weight:300;line-height:1}
.disc svg{width:65.6%;height:auto;overflow:visible;fill:none;stroke-width:1.5}
/* the dished slope around each raised button */
.disc::before{content:"";position:absolute;inset:-10.9%;border-radius:50%;background:conic-gradient(from 300deg,#fff 0,#CDD3E0 20%,#CFD5E2 77%,#fff 100%);filter:blur(calc(var(--k) * 3));z-index:-1;pointer-events:none}
/* only the sequencer key shows a pressed state; the screen tells you which mode or page you are on */
/* pressed (the Figma press): only the square gets the two inner shadows, so it sits down below its neighbours; the round or oval button inside does not change.
   The square's usual top highlight and bottom line are replaced, not stacked, so no extra line shows along the top edge. shift stays down until the next key. */
.tile.down,.tile.latched,.key.on{box-shadow:inset calc(var(--k) * 3) calc(var(--k) * 3) calc(var(--k) * 4) rgba(0,0,0,.57),inset calc(var(--k) * -3) calc(var(--k) * -3) calc(var(--k) * 4) rgba(0,0,0,.25)}
.tile.off{cursor:default}.tile.off .disc{color:rgba(42,42,42,.5)}.tile.off .disc>*{opacity:.5}
.lbl{font-size:calc(var(--u) * .24);font-weight:600;letter-spacing:.1em}
#rec.on .disc{background:radial-gradient(circle at 38% 30%,#FF7A5C 0,#E8452C 60%,#C7341E 100%);box-shadow:calc(var(--k) * 5) calc(var(--k) * 5) calc(var(--k) * 10) #8991A6,0 0 calc(var(--k) * 14) rgba(232,69,44,.5)}
#rec.on svg circle{fill:#fff}

/* keyboard: black keys 1 unit on the phone and 2 on iPad, oval white keys */
#keys{display:grid;gap:var(--gap);grid-template-columns:repeat(var(--nw,8),minmax(0,1fr));
  grid-template-rows:var(--u) minmax(0,1fr);touch-action:none}
.brow{grid-row:1;grid-column:1/-1;position:relative}
.key.blk{position:absolute;top:0;bottom:0;padding:0}
.key.blk .bd{position:absolute;top:50%;transform:translate(-50%,-50%)}
.key.blk .dish{position:absolute;top:50%;width:calc(var(--k) * 78);height:calc(var(--k) * 78);transform:translate(-50%,-50%);border-radius:50%;background:conic-gradient(from 300deg,#fff 0,#CDD3E0 20%,#CFD5E2 77%,#fff 100%);filter:blur(calc(var(--k) * 3));pointer-events:none}
.key.wht{grid-row:2}
.bd{width:calc(var(--k) * 64);height:calc(var(--k) * 64);border-radius:50%;flex:none;box-sizing:border-box;
  background:#1B1C1C;border:calc(var(--k) * 3) solid #CFD5E2;box-shadow:calc(var(--k) * 5) calc(var(--k) * 5) calc(var(--k) * 10) #8991A6,calc(var(--k) * 1) calc(var(--k) * 1) calc(var(--k) * 3) rgba(246,249,255,.3)}
.pill{position:relative;width:calc(var(--k) * 64);height:calc(100% - var(--k) * 28);border-radius:999px;background:#D3D9E6;
  box-shadow:calc(var(--k) * 5) calc(var(--k) * 5) calc(var(--k) * 10) #8991A6,inset calc(var(--k) * -1) calc(var(--k) * -1) 0 rgba(104,113,138,.5),calc(var(--k) * 1) calc(var(--k) * 1) calc(var(--k) * 3) rgba(246,249,255,.3),inset calc(var(--k) * 1.5) calc(var(--k) * 1.5) 0 #fff}
.pill::before{content:"";position:absolute;inset:calc(var(--k) * -8);border-radius:999px;background:linear-gradient(135deg,#fff 0,#CDD3E0 25%,#CFD5E2 75%,#fff 100%);filter:blur(calc(var(--k) * 3));z-index:-1;pointer-events:none}

/* the display */
#display{position:relative;background:var(--screen);border-radius:calc(var(--k) * 5);overflow:hidden;touch-action:none;min-height:0;container-type:size;color:#E9E9E9}
#screen{position:absolute;inset:0;width:100%;height:100%;display:block}
.corner{position:absolute;display:flex;align-items:center;gap:3cqmin;padding:5cqmin;touch-action:none;z-index:2;line-height:1}
.corner .letter{font-size:9cqmin;font-weight:400}
.corner .num{font-size:9cqmin;color:var(--white);font-variant-numeric:tabular-nums;min-width:1.6em;font-weight:100}
.corner svg{width:8.5cqmin;height:auto;overflow:visible}
#shIcon{width:10.5cqmin}
.corner .peek{font-size:7cqmin;color:var(--white);font-variant-numeric:tabular-nums}
.tl{top:0;left:0}.tr{top:0;right:0}.br{bottom:0;right:0}.bl{bottom:0;left:0}
.s{color:var(--blue)}.g{color:var(--green)}.m{color:var(--orange)}
.pc{flex-direction:column;align-items:flex-start;gap:1.2cqmin}
.pc.tr,.pc.br{align-items:flex-end}
.pc .lab{font-size:3.3cqmin;font-weight:500;letter-spacing:.06em;text-transform:uppercase}
.pc .val{font-size:10cqmin;font-weight:200;font-variant-numeric:tabular-nums}
.c0{color:var(--blue)}.c1{color:var(--green)}.c2{color:var(--white)}.c3{color:var(--orange)}
#songTag{position:absolute;top:4.2cqmin;left:50%;transform:translateX(-50%);z-index:3;font-size:0;color:transparent;
  width:30%;height:9cqmin;padding:0;cursor:pointer}   /* no song name on the display, as on the OP-1; the area still opens the sheet */
#hint{position:absolute;left:50%;bottom:6.5cqmin;transform:translateX(-50%);width:52%;font-size:3.4cqmin;letter-spacing:.06em;color:var(--dim-b);
  pointer-events:none;transition:opacity .6s;text-align:center;text-wrap:balance;z-index:1}
#encRing{position:absolute;z-index:3;touch-action:none;cursor:ns-resize;border-radius:50%}
#encRing svg{width:100%;height:100%;display:block;overflow:visible}

/* iPad: the OP-1's own layout, 17 x 6 units (speaker, volume and keys; display; four encoders; mode, page and sound keys; transport; two octaves) */
body.pad #device{--f:calc(var(--u) * .161);--rt:calc(var(--u) * .16);--rf:calc(var(--rt) + var(--f) + var(--gap));
  width:auto;height:auto;padding:calc(var(--f) + var(--gap));border-radius:var(--rf);grid-template-columns:repeat(17,var(--u));grid-template-rows:repeat(6,var(--u));
  background:var(--seam);   /* the dark line between the frame and the buttons is the same size and colour as the lines between buttons */
  box-shadow:0 calc(var(--u) * .5) calc(var(--u) * 1.2) calc(var(--u) * -.1) rgba(68,76,104,.4),inset calc(var(--k) * 1.5) calc(var(--k) * 1.5) 0 #fff,inset calc(var(--k) * -1) calc(var(--k) * -1) 0 rgba(104,113,138,.5),inset calc(var(--k) * 3) calc(var(--k) * 3) calc(var(--k) * 4) rgba(255,255,255,.55),inset 0 0 0 var(--f) #CFD5E2}
body.pad #speaker{border-top-left-radius:var(--rt)} body.pad #mic{border-top-right-radius:var(--rt)} body.pad #octDn{border-bottom-left-radius:var(--rt)} body.pad #keys>.wht:last-child{border-bottom-right-radius:var(--rt)}
body.pad #device .padonly{display:flex}
body.pad #speaker{grid-area:1/1/3/3;cursor:default}
body.pad #volume{grid-area:1/3/2/5;justify-content:flex-start;padding-left:calc(var(--u) * .25)}
body.pad #help{grid-area:2/3} body.pad #tempoKey{grid-area:2/4}
body.pad #display{grid-area:1/5/3/9}
body.pad .knob{--ks:calc(var(--u) * 1.12)}   /* the Figma knob: the ring is 1.19 units across, the encoder inside it 1.12 */
body.pad .knob{box-shadow:calc(var(--k) * 1) calc(var(--k) * 2) calc(var(--k) * 3) rgba(36,42,66,.25),inset calc(var(--k) * -1) calc(var(--k) * -1) 0 rgba(104,113,138,.5),inset calc(var(--k) * 1.5) calc(var(--k) * 1.5) 0 #fff}
/* the shadow the tip of the knob (the coloured cap) casts: the Figma shadow shape, falling lower right over the ring and out across the tile */
.knob .shd{display:none}
body.pad .knob .shd{display:block;position:absolute;left:50%;top:50%;width:calc(var(--u) * 2);height:calc(var(--u) * 2);margin:calc(var(--u) * -1) 0 0 calc(var(--u) * -1);filter:blur(calc(var(--u) * .18));pointer-events:none}
body.pad .knob .shd::before{content:"";position:absolute;inset:0;background:linear-gradient(146deg,rgba(34,40,66,.8) 52.8%,rgba(34,40,66,0) 84%);clip-path:polygon(71.7% 97.6%,48.7% 64.6%,56.4% 42.8%,99.2% 64.6%,99.2% 97.6%)}
body.pad .knob .cap{position:relative;z-index:1} body.pad .knob::after{z-index:2}
body.pad .knob::before{content:"";position:absolute;inset:calc(var(--u) * -.0335);border-radius:50%;background:rgba(60,66,90,.1);border:var(--gap) solid #4A4E5A;z-index:-1;pointer-events:none;
  box-shadow:inset calc(var(--k) * 3) calc(var(--k) * 4) calc(var(--k) * 5) rgba(0,0,0,.38),calc(var(--k) * 1) calc(var(--k) * 1.5) 0 rgba(255,255,255,.9)}   /* the ring is a recess in the surface, below the knob */
body.pad #k0{grid-area:1/9/3/11} body.pad #k1{grid-area:1/11/3/13} body.pad #k2{grid-area:1/13/3/15} body.pad #k3{grid-area:1/15/3/17}
body.pad #mic{grid-area:1/17} body.pad #album{grid-area:2/17}
body.pad #m_synth{grid-area:3/1} body.pad #m_drum{grid-area:3/2} body.pad #m_tape{grid-area:3/3} body.pad #m_mixer{grid-area:3/4}
body.pad #t0{grid-area:3/5} body.pad #t1{grid-area:3/6} body.pad #t2{grid-area:3/7} body.pad #t3{grid-area:3/8}
body.pad #snd0{grid-area:3/9} body.pad #snd1{grid-area:3/10} body.pad #snd2{grid-area:3/11} body.pad #snd3{grid-area:3/12}
body.pad #snd4{grid-area:3/13} body.pad #snd5{grid-area:3/14} body.pad #snd6{grid-area:3/15} body.pad #snd7{grid-area:3/16}
body.pad #seq{grid-area:3/17}
body.pad #lift{grid-area:4/1} body.pad #drop{grid-area:4/2} body.pad #split{grid-area:4/3}
body.pad #rec{grid-area:5/1} body.pad #play{grid-area:5/2} body.pad #stop{grid-area:5/3}
body.pad #octDn{grid-area:6/1} body.pad #octUp{grid-area:6/2} body.pad #shift{grid-area:6/3}
body.pad #keys{grid-area:4/4/7/18;grid-template-rows:var(--u) calc(var(--u) * 2 + var(--gap))}
#speaker{--fu:calc(var(--u) * 2 / 187)}
#speaker .grill{position:absolute;inset:0;display:block}
#speaker .grill svg{display:block;width:100%;height:100%;overflow:visible}
.knob{--ks:calc(var(--u) * .86);position:relative;width:var(--ks);height:var(--ks);border-radius:50%;background:linear-gradient(135deg,#D9DEEA,#C9CFDC);
  box-shadow:calc(var(--k) * 3) calc(var(--k) * 12) calc(var(--k) * 28) rgba(68,76,104,.42),inset calc(var(--k) * -1) calc(var(--k) * -1) 0 rgba(104,113,138,.5),inset calc(var(--k) * 1.5) calc(var(--k) * 1.5) 0 #fff;display:flex;align-items:center;justify-content:center;touch-action:none;cursor:ns-resize}
.cap{position:relative;width:calc(var(--k) * 64);height:calc(var(--k) * 64);flex:none;border-radius:50%;display:flex;justify-content:center;border:calc(var(--k) * 6.5) solid #DDE2EE;background-clip:padding-box!important;}   /* the shading lives on the fixed layer (.knob::after), not on the turning cap */
/* the cap turns, the light does not: gloss and shading sit on a layer that stays put, and the knob's shadow always falls straight down onto the button below */
.knob::after{content:"";position:absolute;left:50%;top:50%;width:calc(var(--k) * 64);height:calc(var(--k) * 64);margin:calc(var(--k) * -32) 0 0 calc(var(--k) * -32);border-radius:50%;
  background:radial-gradient(circle at 33% 27%,rgba(255,255,255,.24),rgba(255,255,255,0) 48%),radial-gradient(circle at 66% 82%,rgba(0,0,0,.12),rgba(0,0,0,0) 56%);
  box-shadow:inset calc(var(--k) * -2) calc(var(--k) * -2) calc(var(--k) * 1) rgba(120,128,150,.4),inset calc(var(--k) * 2) calc(var(--k) * 2) calc(var(--k) * 2) rgba(255,255,255,.85);pointer-events:none}
.tile.enc{z-index:3}   /* the knobs are taller than the buttons: their shadow reaches over the row below */
.cap i{position:absolute;left:50%;top:50%;width:calc(var(--k) * 5);height:76%;transform:translate(-50%,-50%);border-radius:3px;background:rgba(0,0,0,.24);box-shadow:inset calc(var(--k) * var(--lx,0) * 1.4) calc(var(--k) * var(--ly,1) * 1.4) calc(var(--k) * 1.5) rgba(0,0,0,.45),calc(var(--k) * var(--lx,0) * 1.1) calc(var(--k) * var(--ly,1) * 1.1) 0 rgba(255,255,255,.4)}   /* the light is fixed (upper left): --lx/--ly turn the offsets against the cap's rotation. a groove straight through the middle of the cap */

/* menus on the screen: engine, drum kit, effect, LFO */
#menu{position:absolute;inset:0;z-index:6;background:#000;display:flex;flex-direction:column;
  padding:5cqmin 9cqmin;overflow:hidden;touch-action:pan-y}
#menu .mrow{flex:1;min-height:0;margin:0}
#menu .list{max-height:100%;overflow-y:auto;position:relative;touch-action:pan-y}
#menu .list.pre{height:100%;overflow:hidden;align-items:center}
#menu .list>div{max-height:100%;overflow-y:auto;position:relative;touch-action:pan-y}
/* no scroll bar anywhere on the display; lists still scroll by touch or wheel */
#display,#display *,#menu{scrollbar-width:none;-ms-overflow-style:none}
#display::-webkit-scrollbar,#display *::-webkit-scrollbar,#menu::-webkit-scrollbar{display:none;width:0;height:0}
#menu[hidden]{display:none}
/* holding a sound key: a ring fills while it saves, so a tap never overwrites a sound */
#saving{position:absolute;inset:0;z-index:7;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.6);pointer-events:none}
#saving[hidden]{display:none}
#saving .ring{position:relative;width:38cqmin;height:38cqmin}
#saving svg{width:100%;height:100%;transform:rotate(-90deg);overflow:visible}
#saving circle{fill:none;stroke-width:2.5}
#saving .trk{stroke:rgba(255,255,255,.16)}
#saving .arc{stroke:var(--green);stroke-dasharray:100 100;stroke-dashoffset:100;stroke-linecap:round}
#saving.run .arc{transition:stroke-dashoffset var(--save-ms,2s) linear;stroke-dashoffset:0}
#saving .txt{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.5cqmin;color:#E9E9E9}
#saving .n{font-size:12cqmin;font-weight:200;line-height:1}
#saving .w{font-size:3.6cqmin;letter-spacing:.16em;text-transform:uppercase;color:#8a8a8a}
#saving.done .w{color:var(--green)}

/* phone in landscape: 15 x 7 units with a two-octave keyboard (C to C) */
body.land #device{width:auto;height:auto;padding:0;grid-template-columns:repeat(15,var(--u));grid-template-rows:repeat(7,var(--u))}
body.land #display{grid-area:1/4/4/14}
body.land #m_synth{grid-area:1/1} body.land #m_drum{grid-area:1/2} body.land #m_tape{grid-area:1/3}
body.land #m_mixer{grid-area:2/1} body.land #seq{grid-area:2/2} body.land #album{grid-area:2/3;display:flex}
body.land #rec{grid-area:3/1} body.land #play{grid-area:3/2} body.land #stop{grid-area:3/3}
body.land #k0{grid-area:1/14} body.land #k1{grid-area:1/15} body.land #k2{grid-area:2/14} body.land #k3{grid-area:2/15}
body.land #help{grid-area:3/14;display:flex} body.land #tempoKey{grid-area:3/15;display:flex}
body.land #t0{grid-area:4/1} body.land #t1{grid-area:4/2} body.land #t2{grid-area:4/3} body.land #t3{grid-area:4/4}
body.land #snd0{grid-area:4/5} body.land #snd1{grid-area:4/6} body.land #snd2{grid-area:4/7} body.land #snd3{grid-area:4/8}
body.land #snd4{grid-area:4/9} body.land #snd5{grid-area:4/10} body.land #snd6{grid-area:4/11} body.land #snd7{grid-area:4/12}
body.land #octDn{grid-area:4/13} body.land #octUp{grid-area:4/14} body.land #shift{grid-area:4/15}
body.land #keys{grid-area:5/1/8/16}
#menu .mrow{display:flex;align-items:center;justify-content:flex-start;gap:7cqmin}
#menu .lead{display:flex;flex-direction:column;align-items:center;gap:1.4cqmin;flex:none}
#menu .lead .w{width:17cqmin;height:10cqmin;color:var(--blue);overflow:visible}
#menu .lead .w *{vector-effect:non-scaling-stroke;stroke-width:2px}
#menu .lead .n{height:28cqmin;width:auto;color:#E9E9E9;overflow:visible}
#menu .lead .dots{width:14cqmin;height:14cqmin;color:var(--blue)}
#menu .list>div{display:flex;flex-direction:column;align-items:flex-start}
#menu .list>div button:not(.cur){color:var(--mc)}
#menu .list{display:grid;grid-template-columns:repeat(var(--mcols,1),minmax(0,1fr));column-gap:6cqmin}
#menu button{font-size:11.5cqmin;line-height:1.28;font-weight:100;text-align:left;color:var(--mc,#5B7CFA);padding:.3cqmin 2cqmin;margin-left:-2cqmin;letter-spacing:.03em;text-transform:uppercase;white-space:nowrap}
#menu button.cur{background:var(--mc,#5B7CFA);color:#000;font-weight:100}
#menu button:not(.cur):hover{color:#fff}

/* COM (the album key): songs and account, in the display and set like the menus: the same type, size and colours */
#sheet{position:absolute;inset:0;z-index:7;background:#000;display:flex;flex-direction:column;padding:5cqmin 9cqmin;overflow:hidden;color:#E9E9E9;touch-action:pan-y}
#sheet[hidden]{display:none}
#sheet .mrow{flex:1;min-height:0;display:flex;align-items:center;gap:7cqmin}
#sheet .lead{flex:none;display:flex;flex-direction:column;align-items:center}
#sheet .lead svg{width:24cqmin;height:24cqmin;color:#DFD9FF;overflow:visible}
#sheet .list{flex:1;min-width:0;height:100%;display:grid;grid-template-columns:auto minmax(0,1fr);column-gap:6cqmin;align-items:center}
#sheet .list>div{max-height:100%;overflow-y:auto;position:relative;touch-action:pan-y;display:flex;flex-direction:column;align-items:flex-start}
#sheet .c1{--mc:var(--blue)} #sheet .c2{--mc:var(--green)}
#sheet button,#sheet input{font-family:inherit;font-size:11.5cqmin;line-height:1.28;font-weight:100;letter-spacing:.03em;text-transform:uppercase;text-align:left;background:none;border:0;padding:.3cqmin 2cqmin;margin:0 0 0 -2cqmin;white-space:nowrap;color:var(--mc);cursor:pointer}
#sheet button.cur{background:var(--mc);color:#000}
#sheet button:disabled{opacity:.45;cursor:default}
#sheet button:not(.cur):not(:disabled):hover{color:#fff}
#sheet input{-webkit-user-select:text;user-select:text;-webkit-touch-callout:default;color:#DFD9FF;width:50cqmin;outline:0;cursor:text;border-radius:0}
#sheet input:focus{background:#DFD9FF;color:#000}
#sheet #acct{display:flex;flex-direction:column;align-items:flex-start}
#sheet #acct span{font-size:11.5cqmin;line-height:1.28;font-weight:100;text-transform:uppercase;letter-spacing:.03em;color:#DFD9FF}
#sheet #saveState{font-size:8cqmin;font-weight:100;color:var(--orange);text-transform:uppercase;letter-spacing:.03em}
#sheet ul{list-style:none;margin:0;padding:0}
#sheet li{display:flex;align-items:center;gap:3cqmin}
#sheet li button.del{color:var(--orange);font-size:8cqmin}
#sheet .k{color:var(--blue)}
</style>

    <canvas id="screen"></canvas>
    <button id="songTag" aria-label="Songs and account">untitled</button>
    <div id="tombUI">

        <span class="letter s">S</span><span class="glyph"><span class="num" id="speedNum">34</span></span>
      </button>
      <button class="corner tr" id="cGrav" aria-label="Gravity. Tap to show its encoder, drag up or down to turn">

        <span class="glyph"><span class="peek" id="gPeek" hidden></span>
        <svg id="gIcon" viewBox="0 0 32 32"><circle cx="16" cy="16" r="13" fill="none" stroke="var(--green)" stroke-width="2.4"/><circle id="gDot" cx="16" cy="16" r="5" fill="var(--green)"/></svg></span>
      </button>
      <button class="corner br" id="cMass" aria-label="Mass and bounciness. Tap to show its encoder, drag up or down to turn">

        <svg id="mIcon" viewBox="0 0 40 32"><g stroke="var(--orange)" stroke-width="2.4" stroke-linecap="round" fill="#FF4D3D">

<script>
/* a phone is an instrument here: no pinch zoom, no double-tap zoom, no rubber band, even with a key held down and a second finger on an encoder */
['gesturestart', 'gesturechange', 'gestureend'].forEach(t => document.addEventListener(t, e => e.preventDefault(), {passive:false}));
document.addEventListener('touchmove', e => { if (e.touches.length > 1 || (e.scale && e.scale !== 1)) e.preventDefault(); }, {passive:false});
document.addEventListener('wheel', e => { if (e.ctrlKey) e.preventDefault(); }, {passive:false});
(() => {
